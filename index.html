<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Battery Tracker | Ankit Yadav</title>
    <style>
        
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #333;
        }

        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }

        h1 {
            color: #4CAF50;
            margin-bottom: 20px;
        }

        .battery {
            width: 200px;
            height: 80px;
            border: 4px solid #333;
            border-radius: 10px;
            margin: 20px auto;
            position: relative;
            background: #ddd;
        }

        .battery::after {
            content: '';
            position: absolute;
            top: 30%;
            right: -8px;
            width: 8px;
            height: 40%;
            background: #333;
            border-radius: 0 2px 2px 0;
        }

        .fill {
            height: 100%;
            background: linear-gradient(to right, #4CAF50, #8BC34A);
            border-radius: 5px;
            transition: width 0.5s ease;
            position: absolute;
            bottom: 0;
            left: 0;
        }

        .low { background: linear-gradient(to right, #f44336, #ff5722); }
        .medium { background: linear-gradient(to right, #FF9800, #FFC107); }

        .status {
            font-size: 24px;
            font-weight: bold;
            margin: 10px 0;
        }

        .details {
            font-size: 16px;
            margin-top: 20px;
        }

        .charging {
            color: #2196F3;
        }

        .error {
            color: #f44336;
        }

        /* Responsive for mobile */
        @media (max-width: 480px) {
            .container {
                margin: 20px;
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Battery Tracker</h1>
        <div class="battery">
            <div class="fill" id="batteryFill"></div>
        </div>
        <div class="status" id="batteryStatus">Checking...</div>
        <div class="details">
            <p>Level: <span id="batteryLevel">0</span>%</p>
            <p>Status: <span id="chargingStatus">Unknown</span></p>
            <p>Last Updated: <span id="lastUpdate">--:--</span></p>
        </div>
    </div>

    <script>

        const batteryFill = document.getElementById('batteryFill');
        const batteryStatus = document.getElementById('batteryStatus');
        const batteryLevel = document.getElementById('batteryLevel');
        const chargingStatus = document.getElementById('chargingStatus');
        const lastUpdate = document.getElementById('lastUpdate');

        let battery;

        if ('getBattery' in navigator) {
            navigator.getBattery().then(function(bat) {
                battery = bat;
                updateBatteryInfo();
                
                battery.addEventListener('levelchange', updateBatteryInfo);
                battery.addEventListener('chargingchange', updateBatteryInfo);
            }).catch(function(err) {
                showError('Battery API not available: ' + err.message);
            });
        } else {
            showError('Battery Status API not supported in this browser');
        }

        function updateBatteryInfo() {
            if (!battery) return;

            const level = Math.round(battery.level * 100);
            const isCharging = battery.charging;
            
            batteryLevel.textContent = level;
            
            batteryFill.style.width = level + '%';
            batteryFill.className = 'fill';
            if (level < 20) {
                batteryFill.classList.add('low');
                batteryStatus.textContent = 'Low Battery! ⚠️';
            } else if (level < 50) {
                batteryFill.classList.add('medium');
                batteryStatus.textContent = 'Medium Battery';
            } else {
                batteryStatus.textContent = 'Good Battery ✅';
            }
            
            chargingStatus.textContent = isCharging ? 'Charging' : 'Not Charging';
            if (isCharging) {
                chargingStatus.classList.add('charging');
            } else {
                chargingStatus.classList.remove('charging');
            }
            
            
        }

        function showError(message) {
            batteryStatus.textContent = 'Error';
            batteryStatus.classList.add('error');
            document.querySelector('.details').innerHTML = '<p class="error">' + message + '</p>';
        }
        
        <h1>UPDATED NOW</h1>
        // Initial check
        console.log('Battery Tracker loaded!');
    </script>
</body>
</html>
