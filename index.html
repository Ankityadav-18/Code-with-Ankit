<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Battery Tracker</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;

      background: linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #334155
      );
    }

    .container{
      width:350px;
      padding:30px;
      border-radius:20px;

      background: rgba(255,255,255,0.12);
      backdrop-filter: blur(12px);

      box-shadow:0 8px 30px rgba(0,0,0,0.3);

      text-align:center;
      color:white;
    }

    h1{
      margin-bottom:25px;
      font-size:32px;
      color:#4ade80;
    }

    .battery{
      width:220px;
      height:100px;

      border:5px solid white;
      border-radius:15px;

      margin:20px auto;
      position:relative;

      overflow:hidden;
    }

    .battery::after{
      content:"";
      position:absolute;

      right:-18px;
      top:30px;

      width:12px;
      height:35px;

      background:white;
      border-radius:5px;
    }

    .level{
      height:100%;
      width:0%;

      background:linear-gradient(
        90deg,
        #22c55e,
        #4ade80
      );

      transition:0.5s;
    }

    .status{
      margin-top:20px;
      font-size:18px;
      line-height:1.8;
    }

    .battery-text{
      font-size:34px;
      font-weight:bold;
      margin-top:15px;
    }

    .updated{
      margin-top:10px;
      color:#cbd5e1;
      font-size:15px;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Battery Tracker</h1>

    <div class="battery">
      <div class="level" id="level"></div>
    </div>

    <div class="battery-text" id="batteryText">
      Loading...
    </div>

    <div class="status">
      <p>Level: <span id="percentage"></span>%</p>
      <p>Status: <span id="charging"></span></p>
    </div>

    <div class="updated">
      Last Updated:
      <span id="time"></span>
    </div>

  </div>

<script>

async function batteryInfo(){

    const battery = await navigator.getBattery();

    function updateBattery(){

        const level = Math.floor(battery.level * 100);

        document.getElementById("percentage").innerText = level;

        document.getElementById("charging").innerText =
            battery.charging ? "Charging" : "Not Charging";

        document.getElementById("level").style.width = level + "%";

        document.getElementById("time").innerText =
            new Date().toLocaleTimeString();

        const text = document.getElementById("batteryText");

        if(level > 80){
            text.innerText = "High Battery";
        }
        else if(level > 40){
            text.innerText = "Medium Battery";
        }
        else{
            text.innerText = "Low Battery";
        }
    }

    updateBattery();

    battery.addEventListener("levelchange", updateBattery);

    battery.addEventListener("chargingchange", updateBattery);
}

batteryInfo();

</script>

</body>
</html>
