<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Battery Tracker</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: 'Segoe UI', sans-serif;
    }

    body{
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;

      background:
      linear-gradient(
        135deg,
        #0f172a,
        #1e293b,
        #111827
      );

      overflow:hidden;
    }

    .card{

      width:360px;
      padding:35px;

      border-radius:25px;

      background:rgba(255,255,255,0.08);

      backdrop-filter:blur(15px);

      border:1px solid rgba(255,255,255,0.15);

      box-shadow:
      0 10px 40px rgba(0,0,0,0.4);

      text-align:center;

      color:white;
    }

    h1{
      font-size:38px;
      margin-bottom:25px;

      color:#4ade80;
    }

    .battery{

      width:230px;
      height:95px;

      border:5px solid white;

      border-radius:18px;

      margin:20px auto;

      position:relative;

      overflow:hidden;
    }

    .battery::after{

      content:"";

      position:absolute;

      right:-18px;
      top:28px;

      width:12px;
      height:35px;

      background:white;

      border-radius:5px;
    }

    .level{

      height:100%;
      width:0%;

      border-radius:10px;

      transition:0.5s ease;

      background:
      linear-gradient(
        90deg,
        #22c55e,
        #4ade80
      );
    }

    .status-text{

      font-size:40px;
      font-weight:bold;

      margin-top:18px;
    }

    .info{

      margin-top:18px;

      font-size:20px;

      line-height:2;
    }

    .updated{

      margin-top:18px;

      font-size:15px;

      color:#d1d5db;
    }

  </style>
</head>

<body>

  <div class="card">

    <h1>🔋 Battery Tracker</h1>

    <div class="battery">
      <div class="level" id="level"></div>
    </div>

    <div class="status-text" id="batteryText">
      Loading...
    </div>

    <div class="info">
      <p>Battery: <span id="percentage"></span>%</p>

      <p>Status:
        <span id="charging"></span>
      </p>
    </div>

    <div class="updated">
      Last Updated:
      <span id="time"></span>
    </div>

  </div>

<script>

async function batteryInfo(){

    const battery = await navigator.getBattery();

    function updateBattery(){

        const level = Math.floor(battery.level * 100);

        document.getElementById("percentage").innerText = level;

        document.getElementById("charging").innerText =
        battery.charging ? "⚡ Charging" : "Not Charging";

        document.getElementById("time").innerText =
        new Date().toLocaleTimeString();

        const batteryLevel =
        document.getElementById("level");

        batteryLevel.style.width = level + "%";

        const batteryText =
        document.getElementById("batteryText");

        if(level > 80){

            batteryText.innerText = "High Battery";

            batteryLevel.style.background =
            "linear-gradient(90deg,#22c55e,#4ade80)";
        }

        else if(level > 40){

            batteryText.innerText = "Medium Battery";

            batteryLevel.style.background =
            "linear-gradient(90deg,#facc15,#fbbf24)";
        }

        else{

            batteryText.innerText = "Low Battery";

            batteryLevel.style.background =
            "linear-gradient(90deg,#ef4444,#f87171)";
        }
    }

    updateBattery();

    battery.addEventListener(
      "levelchange",
      updateBattery
    );

    battery.addEventListener(
      "chargingchange",
      updateBattery
    );
}

batteryInfo();

</script>

</body>
</html>
