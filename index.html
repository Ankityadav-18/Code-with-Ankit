<script>

async function batteryInfo(){

    const battery = await navigator.getBattery();

    function updateBattery(){

        const level = Math.floor(battery.level * 100);

        document.getElementById("percentage").innerText = level;

        document.getElementById("charging").innerText =
            battery.charging ? "⚡ Charging" : "Not Charging";

        document.getElementById("level").style.width = level + "%";

        document.getElementById("time").innerText =
            new Date().toLocaleTimeString();

        const text = document.getElementById("batteryText");
        const batteryBar = document.getElementById("level");

        // ---------- BATTERY STATUS ----------
        if(level > 80){

            text.innerText = "High Battery";
            batteryBar.style.background =
                "linear-gradient(90deg,#22c55e,#4ade80)";

        }
        else if(level > 40){

            text.innerText = "Medium Battery";
            batteryBar.style.background =
                "linear-gradient(90deg,#facc15,#fbbf24)";

        }
        else{

            text.innerText = "Low Battery";
            batteryBar.style.background =
                "linear-gradient(90deg,#ef4444,#f87171)";
        }
    }

    updateBattery();

    battery.addEventListener("levelchange", updateBattery);

    battery.addEventListener("chargingchange", updateBattery);
}

batteryInfo();

</script>
